[project]
name = "georural"
version = "0.2.0"
description = "Geolocalização de propriedades rurais com uso de imagens de satélite e aprendizado de máquina"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}

dependencies = [
    # Google Earth Engine
    "earthengine-api>=0.1.370",

    # Geoespacial
    "rasterio>=1.3.9",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "folium>=0.15.0",

    # Machine Learning
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Processamento de imagens
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",

    # Visualização
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",

    # Interface
    "streamlit>=1.28.0",
    "streamlit-folium>=0.20.0",

    # Utilidades
    "pandas>=2.1.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pre-commit>=4.7.0",
]
backend = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2",
    "httpx>=0.26",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[tool.uv]
# Instala sempre as versões vindas do lockfile e evita surpresas entre
# Linux (desenvolvimento/Docker) e Windows (outro desenvolvedor).
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["notebooks/*.ipynb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: testes que exigem serviços externos (banco, rede)",
    "gee: testes que exigem autenticação e cota do Google Earth Engine",
]
