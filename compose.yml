name: georural

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-georural}
      POSTGRES_USER: ${POSTGRES_USER:-georural}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-georural}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - path: .env
        required: false
    environment:
      HOME: /home/app
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-georural}:${POSTGRES_PASSWORD:-georural}@db:5432/${POSTGRES_DB:-georural}
    volumes:
      - ./:/app
      - ${GEE_CREDENTIALS_DIR:-./.earthengine}:/home/app/.config/earthengine
      - ./models:/app/models
      - ./outputs:/app/outputs
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/live', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    restart: unless-stopped
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  download-models:
    profiles: ["tools"]
    image: python:3.13-slim
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
      - ./models:/work/models
      - ./models.lock.json:/work/models.lock.json:ro
    command:
      [
        "python",
        "scripts/download_models.py",
        "--manifest",
        "/work/models.lock.json",
        "--dest",
        "/work/models",
      ]

volumes:
  pgdata:
  frontend_node_modules:
